description: "Track 1 seeded paper-behavior benchmark options for DNN-based inverse maps"

data:
    data_dir: '../data/2020-12-09'
    dataset_layout: legacy_2020_hardcoded
    legacy_validate_test_overlap: true

    features_type: 'TIME_NOISE'
    features_use_channels_range:
        - 0
        - 1
    features_normalize: False
    features_sub_length: 1000
    features_sub_begin_random: True
    features_additive_noise_std: 0
    targets_type: 'ODE'
    targets_normalize: False

    # Table 1 (paper): Ntrain=1000, Nvalidate=2000, Ntest=2000, batch=32
    Ntrain:    1000
    Nvalidate: 2000
    Ntest:     2000
    train_shuffle_buffer_size: 1000
    train_batch_size: 32
    eval_batch_size: 32
    random_seed: 305
    features_sub_begin_random_eval: false

net:
    type: 'ConvNet'
    conv_layer_kernel: 3
    conv_layer_stride: 2
    conv_layer_padding: 0
    conv_pool_type: 'avg'
    conv_pool_kernel: 2
    conv_pool_stride: 2
    conv_pool_padding: 0
    conv_layer_sizes:
        - 8
        - 16
        - 32
    dense_layer_sizes:
        - 32
        - 32
    activation_fn: 'swish'

optimizer:
    type: 'Adam'
    learning_rate: 2.0e-3
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    weight_decay: 0.0
    learning_rate_scheduler:
        init_learning_rate:
        linear_epochs:
        constant_epochs:
        final_learning_rate:

training:
    epochs: 200

runconfig:
    load_dir:
    save_dir: 'runs/dnn'
    log_epochs: 1
    save_checkpoints_epochs: 50
    debug: True
    show_plots: False
