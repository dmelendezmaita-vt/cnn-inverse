description: "Hodgkin-Huxley smoke options for DNN-based inverse maps"

data:
    data_dir: 'concatenated_data.tar.gz'
    data_prefix: "concatenated_data"
    curr: "0.1"
    dataset_layout: tar_singlefile_split
    use_mmap: true

    features_cols_num: 400000
    targets_cols_num: 6
    file_names:
      features: "y/{data_prefix}_{curr}_curr.npy"
      features_stats: "support_stats/{data_prefix}_{curr}_curr.npy"
      targets: "generated_params/{data_prefix}_{curr}_curr.npy"

    target_names:
      - hh_param_1
      - hh_param_2
      - hh_param_3
      - hh_param_4
      - hh_param_5
      - hh_param_6
    targets_transform:
      - log10
      - log10
      - log10
      - log10
      - log10
      - log10
    targets_transform_eps: 1.0e-12

    features_type: 'TIME'
    features_use_channels_range:
        - 0
        - 1
    features_normalize: False
    features_sub_length: 1000
    features_sub_begin_random: True
    features_sub_begin_random_eval: False
    features_additive_noise_std: 0
    targets_type: 'ODE'
    targets_normalize: True
    target_loss_weight_mode: inverse_std
    target_loss_weights_normalize: True

    Ntrain:    64
    Nvalidate: 32
    Ntest:     64
    train_shuffle_buffer_size: 1000
    train_batch_size: 32
    eval_batch_size:  32
    random_seed: 123

net:
    type: 'ConvNet'
    conv_layer_kernel: 3
    conv_layer_sizes:
        - 8
        - 16
        - 32
    dense_layer_sizes:
        - 128
        - 128
        - 128
        - 128
    activation_fn: 'gelu'

optimizer:
    type: 'AdamW'
    learning_rate: 1.0e-2
    beta1: 0.9
    beta2: 0.999
    epsilon: 1.0e-8
    weight_decay: 0.01
    learning_rate_scheduler:
        init_learning_rate:
        linear_epochs:
        constant_epochs:
        final_learning_rate:

training:
    epochs: 1

runconfig:
    load_dir:
    save_dir: 'runs/dnn_hh_smoke'
    log_epochs: 1
    save_checkpoints_epochs: 1
    debug: True
    show_plots: False
    save_predictions: "test"
    plot_format: "png"
    plot_dpi: 300
