description: Fourth-track HH_full options for DNN-based inverse maps
data:
  data_dir: /projects/neuro-collab/data/tar_files/concatenated_data_no_compression.tar
  data_prefix: concatenated_data
  curr: '0.1'
  dataset_layout: tar_singlefile_split
  use_mmap: true
  features_cols_num: 400000
  targets_cols_num: 6
  file_names:
    features: y/{data_prefix}_{curr}_curr.npy
    features_stats: support_stats/{data_prefix}_{curr}_curr.npy
    targets: generated_params/{data_prefix}_{curr}_curr.npy
  target_names:
  - hh_param_1
  - hh_param_2
  - hh_param_3
  - hh_param_4
  - hh_param_5
  - hh_param_6
  targets_transform:
  - log10
  - log10
  - log10
  - log10
  - log10
  - log10
  targets_transform_eps: 1.0e-12
  features_type: TIME
  features_use_channels_range:
  - 0
  - 1
  features_normalize: true
  features_sub_length: 2000
  features_sub_begin_random: false
  features_sub_begin_random_eval: false
  features_additive_noise_std: 0.01
  targets_type: ODE
  targets_normalize: true
  target_loss_weight_mode: inverse_std
  target_loss_weights_normalize: true
  Ntrain: 4096
  Nvalidate: 1024
  Ntest: 1024
  train_shuffle_buffer_size: 20000
  train_batch_size: 64
  global_train_batch_size: 64
  eval_batch_size: 128
  random_seed: 1103
  features_scale_cache_enabled: true
  split_array_cache_enabled: true
  dataloader_num_workers: 0
  dataloader_persistent_workers: false
  dataloader_prefetch_factor: null
  dataloader_pin_memory: false
net:
  type: ConvNet
  conv_layer_kernel: 3
  conv_layer_sizes:
  - 8
  - 16
  - 32
  dense_layer_sizes:
  - 128
  - 128
  - 128
  - 128
  activation_fn: gelu
optimizer:
  type: AdamW
  learning_rate: 0.01
  beta1: 0.9
  beta2: 0.999
  epsilon: 1.0e-08
  weight_decay: 0.01
  learning_rate_scheduler:
    init_learning_rate: null
    linear_epochs: null
    constant_epochs: null
    final_learning_rate: null
training:
  epochs: 200
runconfig:
  load_dir: null
  save_dir: runs/dnn_hh
  log_epochs: 1
  save_checkpoints_epochs: 10
  debug: true
  show_plots: false
  save_predictions: test
  plot_format: png
  plot_dpi: 300
